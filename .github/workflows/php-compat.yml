name: Compatibilité PHP

on:
  push:
  pull_request:

jobs:
  lint:
    name: Syntaxe PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      # Sans --ignore-platform-reqs : échoue si une dépendance ne supporte pas cette version de PHP
      - run: composer install --no-interaction --prefer-dist
      - run: VENDOR=1 scripts/php-lint.sh

  phpcompat:
    name: PHPCompatibility  (8.2+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: cs2pr, phpcs, composer
      - run: composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
      - run: composer global require --dev phpcompatibility/php-compatibility dealerdirect/phpcodesniffer-composer-installer
      - run: phpcs -q --report=checkstyle | cs2pr
      - run: composer install --no-interaction --prefer-dist --ignore-platform-reqs
      - run: phpcs -q --standard=phpcs-vendor.xml

  phpstan:
    name: PHPStan (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', id: 80200 }
          - { php: '8.3', id: 80300 }
          - { php: '8.4', id: 80400 }
          - { php: '8.5', id: 80500 }
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ldap, mysqli
          tools: composer

      - name: "Restore result cache"
        uses: actions/cache/restore@v6
        with:
          path: tmp # same as in phpstan.neon
          key: "phpstan-result-cache-${{ matrix.php }}-${{ github.run_id }}"
          restore-keys: "phpstan-result-cache-${{ matrix.php }}-"
      - name: "install deps"
        run: composer install --no-interaction --prefer-dist --ignore-platform-reqs
      - name: "Run PHPStan"
        run: vendor/bin/phpstan analyse --no-progress --error-format=github -c phpstan-ci.neon
      - name: "Save result cache"
        uses: actions/cache/save@v6
        if: ${{ !cancelled() }}
        with:
            path: tmp # same as in phpstan.neon
            key: "phpstan-result-cache-${{ matrix.php }}-${{ github.run_id }}"

